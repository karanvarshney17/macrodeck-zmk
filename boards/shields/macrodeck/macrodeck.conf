# Rotary encoder (knob) support
CONFIG_EC11=y
CONFIG_EC11_TRIGGER_GLOBAL_THREAD=y

# Bluetooth stability for this clone board (drops on PC and phone):
# clone boards often lack the DC-DC coil - run the radio on the LDO instead
CONFIG_BOARD_ENABLE_DCDC=n
# connection timing with some slack - key presses still go out instantly
CONFIG_BT_PERIPHERAL_PREF_MIN_INT=6
CONFIG_BT_PERIPHERAL_PREF_MAX_INT=12
CONFIG_BT_PERIPHERAL_PREF_LATENCY=4
CONFIG_BT_PERIPHERAL_PREF_TIMEOUT=600
CONFIG_ZMK_BLE_EXPERIMENTAL_CONN=y
# a bit more radio power for the clone antenna
CONFIG_BT_CTLR_TX_PWR_PLUS_4=y
